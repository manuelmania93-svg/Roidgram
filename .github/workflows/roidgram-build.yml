name: Roidgram build

on:
  push:
    branches:
      - base/nagramxf-stock
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-36"
      - name: Set up Python (Chaquopy bridge source build)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - name: Install Cython (Chaquopy bridge source build)
        run: pip install Cython==3.0.11
      - name: Configure Android SDK Path
        run: echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Restore stable signing key
        env:
          ROIDGRAM_KEYSTORE_BASE64: ${{ secrets.ROIDGRAM_KEYSTORE_BASE64 }}
          ROIDGRAM_KEYSTORE_PASSWORD: ${{ secrets.ROIDGRAM_KEYSTORE_PASSWORD }}
          ROIDGRAM_KEY_ALIAS: ${{ secrets.ROIDGRAM_KEY_ALIAS }}
        run: |
          test -n "$ROIDGRAM_KEYSTORE_BASE64" && test -n "$ROIDGRAM_KEYSTORE_PASSWORD" && test -n "$ROIDGRAM_KEY_ALIAS"
          umask 077
          printf '%s' "$ROIDGRAM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/roidgram-signing.p12"
          echo "ROIDGRAM_KEYSTORE_PATH=$RUNNER_TEMP/roidgram-signing.p12" >> "$GITHUB_ENV"
          printf 'ROIDGRAM_KEYSTORE_PASSWORD=%s\n' "$ROIDGRAM_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'ROIDGRAM_KEY_ALIAS=%s\n' "$ROIDGRAM_KEY_ALIAS" >> "$GITHUB_ENV"
      - name: Unit tests (selection planner)
        run: ./gradlew TMessagesProj:testNormalStagingUnitTest --tests 'org.telegram.ui.SelectBetweenPlannerTest'
      # versionCode is stamped from the run number so every published build is strictly
      # newer than the last - the in-app updater compares versionCode, not versionName.
      - name: Build (staging, stable-signed)
        env:
          ROIDGRAM_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew TMessagesProj:assembleNormalStaging
      - name: Publish-script fixture tests
        run: bash .github/scripts/publish-release-test.sh
      - name: Remove runner signing-key copy
        if: always()
        run: rm -f "$RUNNER_TEMP/roidgram-signing.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: roidgram-staging
          path: TMessagesProj/build/outputs/apk/normal/staging/
          if-no-files-found: error

  smoke:
    name: Emulator smoke test (no credentials)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: roidgram-staging
          path: apk
      - name: Stage APK at absolute path
        run: |
          APK=$(find apk -name '*universal*.apk' | head -1); [ -z "$APK" ] && APK=$(find apk -name '*x86_64*.apk' | head -1)
          [ -z "$APK" ] && { echo "no APK found in artifact"; exit 1; }
          cp "$APK" /tmp/roidgram.apk && ls -la /tmp/roidgram.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: >-
            adb install -r /tmp/roidgram.apk &&
            adb shell monkey -p app.roidgram -c android.intent.category.LAUNCHER 1 &&
            sleep 25 &&
            adb exec-out screencap -p > /tmp/setup-screen.png;
            adb logcat -d > /tmp/logcat.txt || true;
            if grep -q "FATAL EXCEPTION" /tmp/logcat.txt; then echo "App crashed before setup"; exit 1; fi;
            echo "No crash; setup screen screenshot captured"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-artifacts
          path: |
            /tmp/setup-screen.png
            /tmp/logcat.txt
          if-no-files-found: warn

  publish:
    name: Publish release
    # Gated automatic release on the exact main head. Merging to main still requires
    # the user's explicit OK (standing rule); this job only runs after such a merge.
    # Dispatch runs never publish. Nothing is ever deleted or overwritten
    # (see .github/scripts/publish-release.sh gates).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      checks: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_CHECK_NAME: Gradle Build
      EXPECTED_CERT_SHA256: 6b718bd63aff2c39974ff0bcfbfd9ef315e2af4026c90062020beb1dc1880a0f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0 platforms;android-36"
      - uses: actions/download-artifact@v4
        with:
          name: roidgram-staging
          path: apk
      - name: Gate and publish
        run: |
          APK=$(find apk -name '*arm64*.apk' | head -1)
          test -n "$APK"
          bash .github/scripts/publish-release.sh "$APK"
